[project]
name = "opsfleet-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.9.0",
    "fastapi>=0.162.5",
    "google-cloud-bigquery>=3.47.0",
    "google-genai>=3.0.0",
    "jinja2>=3.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "markdown-it-py>=4.0",
    "matplotlib>=3.11.2",
    "opentelemetry-sdk>=1.45.2",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.31.0",
    "typer>=0.29.1",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
opsfleet-agent = "opsfleet_agent:main"
opsfleet-eval = "opsfleet_agent.evals.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# bq_client.py is a file from the client (OpsFleet). Keep it unchanged.
[tool.ruff]
extend-exclude = ["src/opsfleet_agent/bq_client.py"]
force-exclude = true  # also exclude it when a tool passes the file path directly (pre-commit, editor)

[tool.pyright]
ignore = ["src/opsfleet_agent/bq_client.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls Gemini or BigQuery for real; run by hand with `uv run pytest -m live`",
]
