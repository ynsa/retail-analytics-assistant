  - id: TM-10
    user: ceo
    turns: ["What was the monthly churn rate from January to June 2026?"]
    capability: time_metrics
    difficulty: hard
    query_types: [time_series, window]
    period: {from: "2026-01-01", to: "2026-07-01"}
    reference_sql: |
      WITH purchases AS (
        SELECT DISTINCT oi.user_id, DATE(oi.created_at) AS d
        FROM `bigquery-public-data.thelook_ecommerce.order_items` AS oi
        JOIN `bigquery-public-data.thelook_ecommerce.products` AS p ON p.id = oi.product_id
        WHERE oi.status != 'Cancelled'
          AND oi.created_at < TIMESTAMP '2026-07-01'
          AND (@all_brands OR p.brand IN UNNEST(@brands))
      ),
      gaps AS (
        SELECT user_id, d, LEAD(d) OVER (PARTITION BY user_id ORDER BY d) AS next_d
        FROM purchases
      ),
      churn AS (
        SELECT user_id, DATE_ADD(d, INTERVAL 90 DAY) AS churn_d
        FROM gaps
        WHERE next_d IS NULL OR next_d > DATE_ADD(d, INTERVAL 90 DAY)
      ),
      months AS (
        SELECT m FROM UNNEST(GENERATE_DATE_ARRAY(DATE '2026-01-01', DATE '2026-06-01', INTERVAL 1 MONTH)) AS m
      ),
      active AS (
        SELECT months.m, COUNT(DISTINCT purchases.user_id) AS active_customers
        FROM months CROSS JOIN purchases
        WHERE purchases.d >= DATE_SUB(months.m, INTERVAL 90 DAY) AND purchases.d < months.m
        GROUP BY months.m
      ),
      churned AS (
        SELECT DATE_TRUNC(churn_d, MONTH) AS m, COUNT(DISTINCT user_id) AS churned_customers
        FROM churn
        WHERE churn_d >= DATE '2026-01-01' AND churn_d < DATE '2026-07-01'
        GROUP BY m
      )
      SELECT active.m AS month, churned.churned_customers, active.active_customers,
        SAFE_DIVIDE(churned.churned_customers, active.active_customers) AS churn_rate
      FROM active LEFT JOIN churned ON churned.m = active.m
      ORDER BY month
    expected:
      mode: rows_ordered
      columns:
        month: {role: key, kind: month}
        churn_rate: {role: value, kind: ratio}
    facts:
      - {column: churn_rate, where: {month: "2026-06"}}
    scoring: [execution_match, answer_facts]
    expected_calls: 4
    notes: >-
      Churn (glossary): a customer churns on the day when 90 days pass after a purchase without a new
      purchase. Monthly churn rate = customers who churn in the month / customers with a purchase in
      the 90 days before the first day of the month.
    reviewed_by: claude-draft
    reviewed_at: "2026-11-11"

