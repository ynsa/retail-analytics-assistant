  - id: PP-03
    user: ceo
    turns: ["Compare Calvin Klein and Carhartt in 2025: revenue, items sold and average sale price."]
    capability: product_performance
    difficulty: medium
    query_types: [comparison]
    period: {from: "2025-01-01", to: "2026-01-01"}
    params: {focus_brands: ["Calvin Klein", "Carhartt"]}
    reference_sql: |
      SELECT p.brand, SUM(oi.sale_price) AS revenue, COUNT(*) AS items_sold,
        AVG(oi.sale_price) AS average_sale_price
      FROM `bigquery-public-data.thelook_ecommerce.order_items` AS oi
      JOIN `bigquery-public-data.thelook_ecommerce.products` AS p ON p.id = oi.product_id
      WHERE oi.status NOT IN ('Cancelled', 'Returned')
        AND oi.created_at >= TIMESTAMP '2025-01-01' AND oi.created_at < TIMESTAMP '2026-01-01'
        AND (@all_brands OR p.brand IN UNNEST(@brands))
        AND p.brand IN UNNEST(@focus_brands)
      GROUP BY p.brand
    expected:
      mode: rows
      columns:
        brand: {role: key}
        revenue: {role: value, kind: money}
        items_sold: {role: value, kind: count}
        average_sale_price: {role: value, kind: money}
    facts:
      - {column: revenue, where: {brand: "Calvin Klein"}}
      - {column: revenue, where: {brand: "Carhartt"}}
      - {column: items_sold, where: {brand: "Carhartt"}}
