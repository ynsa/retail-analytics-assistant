# Accuracy set (spec 21): 50 questions and 2 regression cases, each with a reference SQL and a
# scoring rule.
#
# Rules for every reference SQL (spec 21, B2.5):
# - full table names, only the necessary columns, no PII column;
# - the brand scope with the parameters @all_brands and @brands (never a brand list in the SQL);
#   a brand that the question names goes in the parameter @focus_brands;
# - the definitions of spec 21 B2.2 and spec 31 B2.6: revenue = SUM(sale_price) of items with
#   status not Cancelled and not Returned; purchase = item not Cancelled; the date of a sale is
#   order_items.created_at (UTC); closed periods before today.
# - `expected.columns` lists the columns that the scorer compares. Other columns of the SQL are
#   context for the reviewer and the judge.
#
# reviewed_by: claude-draft means: Claude checked the SQL and the snapshot of 2026-11-11.

set: accuracy
kind: accuracy
description: 50 questions on customers, products, time, schema, multi-step, reports and empty results, and 2 regression cases.

cases:
  # ---------------------------------------------------------------- Customer behavior (CB)
  - id: CB-01
    user: ceo
    turns: ["How many customers placed at least one order in 2025?"]
    capability: customer_behavior
    difficulty: easy
    query_types: [aggregation]
    period: {from: "2025-01-01", to: "2026-01-01"}
    reference_sql: |
      SELECT COUNT(DISTINCT oi.user_id) AS customers
      FROM `bigquery-public-data.thelook_ecommerce.order_items` AS oi
      JOIN `bigquery-public-data.thelook_ecommerce.products` AS p ON p.id = oi.product_id
      WHERE oi.status != 'Cancelled'
        AND oi.created_at >= TIMESTAMP '2025-01-01' AND oi.created_at < TIMESTAMP '2026-01-01'
        AND (@all_brands OR p.brand IN UNNEST(@brands))
    expected:
      mode: value
      columns:
        customers: {role: value, kind: count}
    facts:
      - {column: customers}
    scoring: [execution_match, answer_facts]
    expected_calls: 3
    notes: A customer is a user with at least one purchase (item not Cancelled), as in the glossary.
    reviewed_by: claude-draft
    reviewed_at: "2026-11-11"

  - id: CB-02
    user: ceo
    turns: ["Who are the top 10 customers by total spend in 2025? Show the customer ID and the spend."]
    capability: customer_behavior
    difficulty: medium
    query_types: [ranking]
    period: {from: "2025-01-01", to: "2026-01-01"}
    reference_sql: |
      SELECT oi.user_id, SUM(oi.sale_price) AS spend
      FROM `bigquery-public-data.thelook_ecommerce.order_items` AS oi
      JOIN `bigquery-public-data.thelook_ecommerce.products` AS p ON p.id = oi.product_id
      WHERE oi.status NOT IN ('Cancelled', 'Returned')
        AND oi.created_at >= TIMESTAMP '2025-01-01' AND oi.created_at < TIMESTAMP '2026-01-01'
        AND (@all_brands OR p.brand IN UNNEST(@brands))
      GROUP BY oi.user_id
      QUALIFY RANK() OVER (ORDER BY SUM(oi.sale_price) DESC) <= 10
      ORDER BY spend DESC
    expected:
      mode: top_k
      k: 10
      columns:
        user_id: {role: key, kind: id}
        spend: {role: value, kind: money}
    facts:
      - {column: spend, where: {user_id: "@rank1"}}
    scoring: [execution_match, answer_facts]
    expected_calls: 3
    reviewed_by: claude-draft
    reviewed_at: "2026-11-11"

