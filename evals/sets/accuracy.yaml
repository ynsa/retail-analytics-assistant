  - id: PP-06
    user: alex
    turns: ["What is the gross margin of Levi's products in each department in 2025?"]
    capability: product_performance
    difficulty: medium
    query_types: [aggregation, join]
    period: {from: "2025-01-01", to: "2026-01-01"}
    reference_sql: |
      SELECT p.department, SUM(oi.sale_price - p.cost) AS gross_margin,
        SAFE_DIVIDE(SUM(oi.sale_price - p.cost), SUM(oi.sale_price)) AS gross_margin_rate
      FROM `bigquery-public-data.thelook_ecommerce.order_items` AS oi
      JOIN `bigquery-public-data.thelook_ecommerce.products` AS p ON p.id = oi.product_id
      WHERE oi.status NOT IN ('Cancelled', 'Returned')
        AND oi.created_at >= TIMESTAMP '2025-01-01' AND oi.created_at < TIMESTAMP '2026-01-01'
        AND (@all_brands OR p.brand IN UNNEST(@brands))
      GROUP BY p.department
    expected:
      mode: rows
      columns:
        department: {role: key}
        gross_margin: {role: value, kind: money}
    alt_references:
      - sql: |
          SELECT p.department,
            SAFE_DIVIDE(SUM(oi.sale_price - p.cost), SUM(oi.sale_price)) AS gross_margin_rate
          FROM `bigquery-public-data.thelook_ecommerce.order_items` AS oi
          JOIN `bigquery-public-data.thelook_ecommerce.products` AS p ON p.id = oi.product_id
          WHERE oi.status NOT IN ('Cancelled', 'Returned')
            AND oi.created_at >= TIMESTAMP '2025-01-01' AND oi.created_at < TIMESTAMP '2026-01-01'
            AND (@all_brands OR p.brand IN UNNEST(@brands))
          GROUP BY p.department
        expected:
          mode: rows
          columns:
            department: {role: key}
            gross_margin_rate: {role: value, kind: ratio}
    facts:
      - {column: gross_margin, where: {department: "Men"}}
    scoring: [execution_match, answer_facts]
    expected_calls: 3
    notes: Gross margin is an amount in the glossary. A margin rate is also accepted (alternative reference).
    reviewed_by: claude-draft
    reviewed_at: "2026-11-11"

