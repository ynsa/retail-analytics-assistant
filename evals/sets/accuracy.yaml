  - id: CB-06
    user: maya
    turns: ["What share of my brands' customers in 2025 bought again in the same year?"]
    capability: customer_behavior
    difficulty: hard
    query_types: [ratio]
    period: {from: "2025-01-01", to: "2026-01-01"}
    reference_sql: |
      WITH c AS (
        SELECT oi.user_id, COUNT(DISTINCT oi.order_id) AS orders
        FROM `bigquery-public-data.thelook_ecommerce.order_items` AS oi
        JOIN `bigquery-public-data.thelook_ecommerce.products` AS p ON p.id = oi.product_id
        WHERE oi.status != 'Cancelled'
          AND oi.created_at >= TIMESTAMP '2025-01-01' AND oi.created_at < TIMESTAMP '2026-01-01'
          AND (@all_brands OR p.brand IN UNNEST(@brands))
        GROUP BY oi.user_id
      )
      SELECT SAFE_DIVIDE(COUNTIF(orders >= 2), COUNT(*)) AS repeat_rate,
        COUNTIF(orders >= 2) AS repeat_customers, COUNT(*) AS customers
      FROM c
    expected:
      mode: value
      columns:
        repeat_rate: {role: value, kind: ratio}
    facts:
      - {column: repeat_rate}
    scoring: [execution_match, answer_facts]
    expected_calls: 4
    notes: A repeat customer has purchases in 2 or more distinct orders of the user's brands in 2025.
    reviewed_by: claude-draft
    reviewed_at: "2026-11-11"

